# Deploy to Cloudflare Pages with pre-rendering
#
# Triggers on every push to main, once a day, and on demand. Installs
# Puppeteer, runs the self-tests, runs the full build (which pre-renders SEO
# routes), then ships dist/ to Cloudflare Pages.
#
# Why daily: the pre-rendered pages bake in the upcoming events and their
# JSON-LD at build time. With no push, that snapshot would keep advertising
# last week's events to crawlers. 17:05 UTC = 00:05 Asia/Ho_Chi_Minh, just
# after the day rolls over in Đà Nẵng.
#
# Required GitHub secrets (set these in your repo settings):
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
#   CLOUDFLARE_API_TOKEN   — API token with "Cloudflare Pages: Edit" permission

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 17 * * *'
  workflow_dispatch:

# One production deploy at a time. A newer run (a push landing during the
# nightly rebuild, two quick pushes) cancels the older one, so an out-of-date
# build can never finish last and overwrite a newer deploy.
concurrency:
  group: pages-production
  cancel-in-progress: true

# The job only reads the repo; Cloudflare auth comes from the API token secret.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Offline, dependency-free unit checks (feed helpers + Schedule Studio
      # data model) — well under a second. A failure stops the deploy before
      # anything is built.
      - name: Self-tests
        run: npm run selftest && npm run selftest:schedule

      # Puppeteer needs these system libs for headless Chrome
      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Build (with pre-rendering)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # v4 runs on Node 24 (GitHub retires Node 20 runners Sept 2026) and
        # installs Wrangler CLI v4 by default — same `pages deploy` interface.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=realitydn
