<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Primary Meta Tags — defaults for the EN home; <SEO> (src/components/
         SEO.jsx) rewrites title/description/og/twitter per route and locale
         from locales/*.js seo.*, and the prerender bakes the result in. -->
    <title>REALITY Đà Nẵng — Café, Cocktail Bar &amp; Community Space</title>
    <meta name="description" content="Café by day, cocktail bar by night and community space in Đà Nẵng. Live music, pub quiz, language exchange, open mic &amp; board games. Open daily 11:00–2:00."/>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="REALITY" />
    <meta property="og:url" content="https://realitydn.com/" />
    <meta property="og:title" content="REALITY Đà Nẵng — Café, Cocktail Bar &amp; Community Space" />
    <meta property="og:description" content="Café by day, cocktail bar by night and community space in Đà Nẵng. Live music, pub quiz, language exchange, open mic &amp; board games. Open daily 11:00–2:00." />
    <!-- Social card. Generated from the ink mark by scripts/build-og-card.mjs
         (`npm run og`) — not a photograph, and not hand-drawn: the cell order
         and palette come from canon, so re-cutting it is always correct.
         Replacing this file in place will NOT refresh already-scraped links;
         ship a new filename if the card ever changes. -->
    <meta property="og:image" content="https://realitydn.com/images/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="REALITY — coffee, cocktails, community. Bar, cafe and community space at 86 Mai Thúc Lân, Đà Nẵng." />
    <!-- og:locale + og:locale:alternate (all six) are set per route by <SEO>. -->
    <meta property="og:locale" content="en_US" />

    <!-- Twitter — card tags use name=, not property= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REALITY Đà Nẵng — Café, Cocktail Bar &amp; Community Space" />
    <meta name="twitter:description" content="Café by day, cocktail bar by night and community space in Đà Nẵng. Live music, pub quiz, language exchange, open mic &amp; board games. Open daily 11:00–2:00." />
    <meta name="twitter:image" content="https://realitydn.com/images/og-card.png" />
    <meta name="twitter:image:alt" content="REALITY — coffee, cocktails, community. Bar, cafe and community space at 86 Mai Thúc Lân, Đà Nẵng." />

    <!-- Favicons. favicon.svg/.ico are the ink square (they render at 16-48px);
         the full avatar lockup is /icon.svg and /icon-512.png, used where there
         is room for it. Generated by the app repo's scripts/build-app-icons.mjs. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Hero image preload — LCP candidate on homepage. -->
    <link rel="preload" as="image" href="/images/hero.jpg" fetchpriority="high" />

    <!-- Theme bootstrap — runs before first paint so a saved Night theme
         doesn't flash cream. Day is the default; prerender always captures
         Day (no localStorage, light color-scheme in the headless browser). -->
    <!-- Theme Color — declared BEFORE the bootstrap so it can flip it for
         Night; ThemeToggle keeps it in sync afterwards. -->
    <meta name="theme-color" content="#fffbf1" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('reality-theme');
          if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0a0703');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts — Year 2 set: Montserrat (Thin display → 800 slam),
         Montserrat Alternates (wordmark only), Space Grotesk (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;500;600;700;800&family=Montserrat+Alternates:wght@600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Canonical + Language
         Default canonical for the shipped index.html; the <SEO> React
         component rewrites it per route and adds the six hreflang alternates
         + x-default (trailing-slash URLs, ISO 639-1 "vi" not "vn"), and
         Puppeteer captures the result into each route's static HTML. -->
    <link rel="canonical" href="https://realitydn.com/" />

    <!-- Structured Data: LocalBusiness (bar + café). Not a Restaurant — the
         menu is drinks plus two snacks (src/data/menu.js). hasMenu points at
         the Menu node MenuSchema.jsx emits on the home pages (same @id), plus
         the PDF. Events reference this node as organizer by @id. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["BarOrPub", "CafeOrCoffeeShop"],
      "@id": "https://realitydn.com/#business",
      "name": "REALITY",
      "alternateName": ["REALITY Đà Nẵng", "REALITY Da Nang"],
      "description": "Café by day, cocktail bar by night and community space in Đà Nẵng: live music, open mics, pub quiz, language exchanges, board games, film club and art shows — the easiest place in the city to make friends.",
      "url": "https://realitydn.com/",
      "email": "realitydn@gmail.com",
      "image": "https://realitydn.com/images/hero.jpg",
      "logo": "https://realitydn.com/icon-512.png",
      "hasMenu": [
        { "@id": "https://realitydn.com/#drinks-menu" },
        "https://realitydn.com/menu-drinks-en.pdf"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "86 Mai Thúc Lân",
        "addressLocality": "Đà Nẵng",
        "addressRegion": "Đà Nẵng",
        "addressCountry": "VN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 16.052411,
        "longitude": 108.241252
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "11:00",
        "closes": "02:00"
      },
      "priceRange": "$$",
      "currenciesAccepted": "VND",
      "servesCuisine": ["Coffee", "Cocktails"],
      "acceptsReservations": false,
      "knowsLanguage": ["en", "vi"],
      "hasMap": "https://maps.google.com/?cid=9022999249739857995",
      "sameAs": [
        "https://www.instagram.com/reality.dn/",
        "https://www.facebook.com/realitybarcafedanang/",
        "https://app.realitydn.com/"
      ]
    }
    </script>

    <!-- Structured Data: WebSite (six languages) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://realitydn.com/#website",
      "url": "https://realitydn.com/",
      "name": "REALITY",
      "alternateName": "REALITY Đà Nẵng",
      "inLanguage": ["en", "vi", "ru", "uk", "ko", "ja"],
      "publisher": { "@id": "https://realitydn.com/#business" }
    }
    </script>

    <meta name="facebook-domain-verification" content="v8dfv6ad2h83rymr9lcykj80unjqmg" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
