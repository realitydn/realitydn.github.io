<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal staff tool — keep it out of search and link graphs.
     Canonical source lives here (public/print/); the local launcher
     (Print Studio.bat) serves these same files. -->
<meta name="robots" content="noindex, nofollow">
<title>REALITY — Print Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;500;700;800&family=Montserrat+Alternates:wght@600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous">
<link href="print.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- React, self-hosted production builds — same reasoning as the vendored PDF
     engine below. These were unpkg *development* builds (1.2 MB combined, and
     slower at runtime because of the dev-only warning checks) alongside
     @babel/standalone, which compiled the .jsx in the browser on every load.
     The .jsx is precompiled by scripts/build-studios.mjs now, so Babel is gone. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Vendored locally so the PDF engine + QR work offline and never drift. -->
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>

<!-- Plain JS (no JSX): the riso photo engine, the IndexedDB image store and
     the Year 2 icon glyph data. Loaded before the app modules so
     window.RISO / window.PrintImg / window.ICON_GLYPHS exist. -->
<script src="riso-engine.js"></script>
<script src="print-store.js"></script>
<script src="print-icons.js"></script>

<!-- Precompiled from the sibling .jsx by scripts/build-studios.mjs. Edit the
     .jsx — the local launcher transpiles it on the fly, the build emits these. -->
<script src="print-data.js"></script>
<script src="print-element.js"></script>
<script src="print-canvas.js"></script>
<script src="print-export.js"></script>
<script src="print-app.js"></script>
</body>
</html>
