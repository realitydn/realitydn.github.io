<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal staff tool — keep it out of search and link graphs.
     Canonical source lives here (public/print/); the local launcher
     (Print Studio.bat) serves these same files. -->
<meta name="robots" content="noindex, nofollow">
<title>REALITY — Print Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;500;700;800&family=Montserrat+Alternates:wght@600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous">
<!-- The chrome all three Studios share (tokens, controls, folds, dialogs),
     then this Studio's own layout on top of it. -->
<link href="../studio-shared/studio-base.css" rel="stylesheet">
<link href="print.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- React, self-hosted production builds — same reasoning as the vendored PDF
     engine below. These were unpkg *development* builds (1.2 MB combined, and
     slower at runtime because of the dev-only warning checks) alongside
     @babel/standalone, which compiled the .jsx in the browser on every load.
     Babel is gone: the Studio is one prebuilt bundle now (below), which reads
     React as this global. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Vendored locally so the PDF engine + QR work offline and never drift. -->
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>

<!-- Plain JS: the riso photo engine (the SAME two files Poster Studio loads —
     one press, no Print-side fork; Print's true-white stock is the engine's
     `white` stock, set in print-data's risoOpts). Loaded before the bundle so
     window.RisoPress / window.RISO exist. -->
<script src="../studio-shared/riso-press.js"></script>
<script src="../studio-shared/riso-engine.js"></script>

<!-- The Studio itself: main.jsx and every module it imports — the IndexedDB
     store, data, element, canvas, PDF export, app, and from ../studio-shared/
     the Year 2 glyph set and the control kit (window.RUI) that Poster Studio
     imports too — bundled by esbuild into one script. Built by
     scripts/build-studios.mjs for deploy; the local launcher
     (tools/serve-print.cjs) bundles it on each request. Edit the .jsx. -->
<script src="print.bundle.js"></script>
</body>
</html>
