<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal staff tool — keep it out of search and link graphs.
     Canonical source lives here (public/studio/); the local launcher
     (Poster Studio.bat) serves these same files. -->
<meta name="robots" content="noindex, nofollow">
<title>REALITY — Poster Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin matters: html-to-image must read this sheet's cssRules to
     embed the fonts into exported PNGs; without it, exports can lose the brand type. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Montserrat+Alternates:wght@600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<link href="studio.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- React, self-hosted production builds. These were unpkg *development*
     builds (1.2 MB combined, and slower at runtime because of the dev-only
     warning checks) alongside @babel/standalone, which compiled the .jsx
     below in the browser on every load. The .jsx is precompiled by
     scripts/build-studios.mjs now, so Babel is gone entirely. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<script src="riso-engine.js"></script>
<!-- Year 2 glyph set (window.ICON_GLYPHS / ICON_CATEGORIES). Generated from
     design-system-year2/…/icons/icons.jsx and shared verbatim with Print
     Studio — loaded from there on purpose so the two studios can never drift
     to different icon sets. Must load before studio-data.js (iconLayout). -->
<script src="../print/print-icons.js"></script>
<script src="studio-store.js"></script>
<!-- WP9: best-effort cloud sync (window.RCloud). Strictly additive — no-ops
     when not signed in or the hub is dormant; localStorage/RStore stay the
     source of truth. Load AFTER studio-store.js, BEFORE the app scripts. -->
<script src="cloud-client.js"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- Precompiled from the sibling .jsx by scripts/build-studios.mjs. Edit the
     .jsx — the local launcher transpiles it on the fly, the build emits these. -->
<script src="studio-data.js"></script>
<script src="studio-element.js"></script>
<script src="studio-canvas.js"></script>
<script src="studio-app.js"></script>
</body>
</html>
