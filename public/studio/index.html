<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal staff tool — keep it out of search and link graphs.
     Canonical source lives here (public/studio/); the local launcher
     (Poster Studio.bat) serves these same files. -->
<meta name="robots" content="noindex, nofollow">
<title>REALITY — Poster Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin matters: html-to-image must read this sheet's cssRules to
     embed the fonts into exported PNGs; without it, exports can lose the brand type. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Montserrat+Alternates:wght@600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<!-- The chrome all three Studios share (tokens, controls, folds, dialogs),
     then this Studio's own layout on top of it. -->
<link href="../studio-shared/studio-base.css" rel="stylesheet">
<link href="studio.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- React, self-hosted production builds. These were unpkg *development*
     builds (1.2 MB combined, and slower at runtime because of the dev-only
     warning checks) alongside @babel/standalone, which compiled the .jsx
     in the browser on every load. Babel is gone entirely: the Studio is one
     prebuilt bundle now (below), which reads React as this global. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- The riso press — ONE copy for Poster Studio, Print Studio and (vendored)
     the app. riso-press.js is the pure separation/press core (window.RisoPress);
     riso-engine.js is the canvas engine over it (window.RISO). Order matters. -->
<script src="../studio-shared/riso-press.js"></script>
<script src="../studio-shared/riso-engine.js"></script>
<!-- Export libraries, self-hosted (were unpkg with no integrity check — a
     compromised CDN could have run code with access to the hub token).
     Byte-for-byte copies of the same pinned files: html-to-image 1.11.11
     (dist/html-to-image.js), jsPDF 2.5.1 (dist/jspdf.umd.min.js), JSZip 3.10.1
     (dist/jszip.min.js). To upgrade, curl the new unpkg URL into vendor/. -->
<script src="vendor/html-to-image.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jszip.min.js"></script>

<!-- The Studio itself: main.jsx and every module it imports — the store
     (window.RStore), the cloud client (window.RCloud), data, element, canvas,
     app, and from ../studio-shared/ the Year 2 glyph set and the control kit
     (window.RUI) that Print Studio imports too — bundled by esbuild into one
     script. Built by scripts/build-studios.mjs for deploy; the local launcher
     (tools/serve-studio.cjs) bundles it on each request. Edit the .jsx. -->
<script src="studio.bundle.js"></script>
</body>
</html>
